name: readme-refresh

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Self-test
        run: node bot/readme-word.js --test

      # Commits as YOU (noreply email), not github-actions[bot], so it counts on the graph.
      - name: Delete + restore a README word
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          node bot/readme-word.js
